name: Build EVEN Android APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify cloud configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::Missing GitHub Actions secrets SUPABASE_URL and/or SUPABASE_PUBLISHABLE_KEY. Refusing to build an APK that silently falls back to local-only mode."
            exit 1
          fi
          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "::error::SUPABASE_URL must be the project's HTTPS Supabase URL."
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          flutter create --platforms=android --org com.even --project-name app /tmp/even-platform
          mkdir -p android
          cp -R /tmp/even-platform/android/. android/
          sed -i 's/android:label="app"/android:label="Even"/' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/values
          cp tool/android/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp tool/android/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp tool/android/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          # Flutter's generated INTERNET permission can be limited to debug/profile
          # manifests. Add it to the main manifest so the release APK can reach APIs.
          internet_permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in xml:
              xml = re.sub(r'(<manifest\\b[^>]*>)', r'\\1\\n' + internet_permission, xml, count=1)
          callback = """
                  <intent-filter android:autoVerify="false">
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="even" android:host="login-callback" />
                  </intent-filter>
          """
          if 'android:host="login-callback"' not in xml:
              updated, count = re.subn(r"</activity>", callback + chr(10) + "            </activity>", xml, count=1)
              if count != 1:
                  raise SystemExit("Could not find the Flutter activity closing tag in AndroidManifest.xml")
              path.write_text(updated)
          PY

      - name: Configure Gradle wrapper and cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not wrapper.exists():
              raise SystemExit("Gradle wrapper properties were not generated")
          content = wrapper.read_text()
          match = re.search(r"gradle-([0-9.]+)-(all|bin)\.zip", content)
          if not match:
              raise SystemExit("Could not identify the generated Gradle distribution")
          version, distribution = match.groups()
          # Use the Aliyun Gradle mirror: the official host redirects to
          # GitHub Releases, which has repeatedly returned HTTP 504 in Actions.
          # The binary-only distribution is smaller than the all-in-one archive.
          content = re.sub(
              r"^distributionUrl=.*$",
              f"distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v{version}/gradle-{version}-bin.zip",
              content,
              flags=re.MULTILINE,
          )
          wrapper.write_text(content)
          print(next(line for line in content.splitlines() if line.startswith("distributionUrl=")))
          PY

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build configured release APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: even-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
